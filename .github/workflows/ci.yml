name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build + image
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pinned toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache bootstrap deps (Limine + edk2 firmware)
        uses: actions/cache@v4
        with:
          path: ferric-k/third_party
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xtask/src/bootstrap.rs') }}
          restore-keys: |
            ${{ runner.os }}-thirdparty-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            target
            xtask/target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Bootstrap (toolchain + qemu + mtools + edk2 firmware + Limine)
        run: cargo xtask bootstrap

      - name: Quality gate without QEMU (fmt, clippy, build, ELF/Limine, tests)
        run: cargo xtask check --no-smoke

      - name: Assemble dual-arch disk image
        run: cargo xtask build-image

      - name: Upload disk image for the smoke jobs
        uses: actions/upload-artifact@v4
        with:
          name: ferric-image
          path: ferric-k/build/ferric.img
          retention-days: 1

  smoke:
    name: smoke boot (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pinned toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache bootstrap deps (Limine + edk2 firmware)
        uses: actions/cache@v4
        with:
          path: ferric-k/third_party
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xtask/src/bootstrap.rs') }}
          restore-keys: |
            ${{ runner.os }}-thirdparty-

      - name: Cache harness build
        uses: actions/cache@v4
        with:
          path: xtask/target
          key: ${{ runner.os }}-xtask-${{ matrix.arch }}-${{ hashFiles('xtask/Cargo.toml', 'xtask/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-xtask-${{ matrix.arch }}-

      - name: Bootstrap (toolchain + qemu + edk2 firmware + Limine)
        run: cargo xtask bootstrap

      - name: Download disk image
        uses: actions/download-artifact@v4
        with:
          name: ferric-image
          path: ferric-k/build

      - name: Smoke boot the image (${{ matrix.arch }})
        run: cargo xtask run --arch ${{ matrix.arch }} --smoke --image-path ferric-k/build/ferric.img --smoke-timeout-sec 240

      - name: Upload serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-serial-${{ matrix.arch }}
          path: ferric-k/build/last-smoke-*.log
          retention-days: 7