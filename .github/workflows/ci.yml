name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4[cite: 1]

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}[cite: 1]
          restore-keys: |
            ${{ runner.os }}-cargo-registry-[cite: 1]

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            target
            xtask/target
            ferric-k/third_party
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('rust-toolchain.toml', 'xtask/src/bootstrap.rs') }}[cite: 1]
          restore-keys: |
            ${{ runner.os }}-build-[cite: 1]

      - name: Bootstrap (toolchain + native deps + Limine)
        run: cargo xtask bootstrap[cite: 1, 2]

      - name: Rebuild kernel ELFs (x86_64 + aarch64)
        run: cargo xtask build[cite: 2]

      - name: Assemble dual-arch bootable disk image
        run: cargo xtask build-image[cite: 2]

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootable-disk-image
          path: build/
          retention-days: 1

  test-qemu:
    name: Test QEMU Boot (${{ matrix.arch }})
    needs: build-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64][cite: 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4[cite: 1]

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}[cite: 1]
          restore-keys: |
            ${{ runner.os }}-cargo-registry-[cite: 1]

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            target
            xtask/target
            ferric-k/third_party
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('rust-toolchain.toml', 'xtask/src/bootstrap.rs') }}[cite: 1]
          restore-keys: |
            ${{ runner.os }}-build-[cite: 1]

      - name: Bootstrap test environment dependencies
        run: cargo xtask bootstrap[cite: 1, 2]

      - name: Download disk image artifact
        uses: actions/download-artifact@v4
        with:
          name: bootable-disk-image
          path: build/

      - name: Boot in QEMU (${{ matrix.arch }})
        run: cargo xtask run --arch ${{ matrix.arch }}[cite: 2]
